<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapChat - Welcome</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: #121212;
            padding: 20px;
        }
        .logo { font-size: 64px; margin-bottom: 10px; }
        .title { font-size: 28px; font-weight: bold; color: #1DA1F2; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 40px; }
        .start-btn {
            background: #1DA1F2;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 80%;
            max-width: 300px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div style="position: absolute; top: 15px; right: 15px; z-index: 20;">
        <button onclick="toggleLanguage()" class="lang-btn" id="langBtn">हिंदी</button>
    </div>

    <div class="splash-screen">
        <div class="logo">🐦</div>
        <div class="title">TapChat</div>
        <div class="subtitle" id="subTitle">The New Social Media & AI Experience</div>
        <button class="start-btn" onclick="window.location.href='login.html'" id="startBtn">Get Started</button>
    </div>
</div>

<script>
    let currentLang = localStorage.getItem('tapchat_lang') || 'en';
    
    function updateText() {
        if(currentLang === 'hi') {
            document.getElementById('subTitle').innerText = "सोशल मीडिया और AI का नया अनुभव";
            document.getElementById('startBtn').innerText = "शुरू करें";
            document.getElementById('langBtn').innerText = "English";
        } else {
            document.getElementById('subTitle').innerText = "The New Social Media & AI Experience";
            document.getElementById('startBtn').innerText = "Get Started";
            document.getElementById('langBtn').innerText = "हिंदी";
        }
    }

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'hi' : 'en';
        localStorage.setItem('tapchat_lang', currentLang);
        updateText();
    }

    updateText();
</script>

</body>
</html>
