<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapChat - Real-time Communication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4">

    <!-- App Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200 flex flex-col h-[92vh]">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-sky-500 to-blue-600 text-white p-4 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-2xl p-1 flex items-center justify-center shadow-inner overflow-hidden">
                    <img src="logo.png" alt="TapChat Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">TapChat</h1>
                    <p class="text-[10px] text-sky-100 font-medium">Real-time Communication</p>
                </div>
            </div>
            <button id="logoutBtn" class="hidden text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-full font-semibold transition border border-white/30">
                लॉगआउट
            </button>
        </div>

        <!-- Login Screen -->
        <div id="loginSection" class="flex-1 flex flex-col justify-center items-center p-6 text-center space-y-6 bg-gradient-to-b from-sky-50/50 to-white">
            <div class="w-32 h-32 bg-white rounded-3xl p-2 flex items-center justify-center shadow-xl border border-sky-100 overflow-hidden">
                <img src="logo.png" alt="TapChat Logo" class="w-full h-full object-contain">
            </div>
            <div>
                <h2 class="text-2xl font-extrabold text-slate-800">TapChat</h2>
                <p class="text-slate-500 text-xs tracking-wider uppercase mt-1 font-semibold">Real-time Communication</p>
            </div>
            <button id="googleLoginBtn" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 text-slate-700 font-bold py-3.5 px-4 rounded-2xl shadow-sm hover:bg-slate-50 transition active:scale-95">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                गूगल से साइन इन करें
            </button>
        </div>

        <!-- Main Chat Area -->
        <div id="chatSection" class="hidden flex-1 flex flex-col h-full overflow-hidden bg-slate-50">
            <div class="bg-white border-b border-slate-200 px-4 py-3 flex items-center gap-3 shadow-sm">
                <img id="userPhoto" class="w-9 h-9 rounded-full border-2 border-sky-500 object-cover" src="" alt="User">
                <div class="flex flex-col">
                    <span id="userName" class="text-sm font-bold text-slate-800"></span>
                    <span class="text-[10px] text-emerald-500 font-semibold flex items-center gap-1">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> ऑनलाइन
                    </span>
                </div>
            </div>

            <div id="messagesContainer" class="flex-1 p-4 overflow-y-auto space-y-3">
                <!-- Messages -->
            </div>

            <form id="messageForm" class="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
                <input id="messageInput" type="text" placeholder="मैसेज टाइप करें..." required class="flex-1 bg-slate-100 text-sm rounded-full px-4 py-3 outline-none focus:ring-2 focus:ring-sky-500 border border-slate-200">
                <button type="submit" class="bg-gradient-to-r from-sky-500 to-blue-600 text-white w-11 h-11 rounded-full flex items-center justify-center hover:opacity-95 active:scale-95 shadow-md">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>

    </div>

    <!-- Firebase Code -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtK4US0eTXURt2Uutb9GYif_NclzXfhZM",
            authDomain: "tapchat-official.firebaseapp.com",
            projectId: "tapchat-official",
            storageBucket: "tapchat-official.firebasestorage.app",
            messagingSenderId: "664579432894",
            appId: "1:664579432894:web:94a1f0fcec86e5883f99ef",
            measurementId: "G-34ZYS900TV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById('loginSection');
        const chatSection = document.getElementById('chatSection');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userName = document.getElementById('userName');
        const userPhoto = document.getElementById('userPhoto');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messagesContainer');

        googleLoginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => alert("Login Error: " + error.message));
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, user => {
            if (user) {
                loginSection.classList.add('hidden');
                chatSection.classList.remove('hidden');
                chatSection.classList.add('flex');
                logoutBtn.classList.remove('hidden');
                userName.textContent = user.displayName || 'यूज़र';
                userPhoto.src = user.photoURL || 'https://via.placeholder.com/150';
                loadMessages();
            } else {
                loginSection.classList.remove('hidden');
                chatSection.classList.add('hidden');
                chatSection.classList.remove('flex');
                logoutBtn.classList.add('hidden');
            }
        });

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';

            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    uid: auth.currentUser.uid,
                    name: auth.currentUser.displayName || 'अनाम',
                    timestamp: serverTimestamp()
                });
            } catch (err) {
                console.error("Error sending message: ", err);
            }
        });

        function loadMessages() {
            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = data.uid === auth.currentUser?.uid;
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                    msgDiv.innerHTML = `
                        <span class="text-[10px] text-slate-400 mb-0.5 px-1 font-medium">${data.name}</span>
                        <div class="max-w-[80%] px-4 py-2.5 rounded-2xl text-sm shadow-sm ${isMe ? 'bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-br-none font-medium' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'}">
                            ${data.text}
                        </div>
                    `;
                    messagesContainer.appendChild(msgDiv);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }
    </script>
</body>
</html>
