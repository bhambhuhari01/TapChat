<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapChat - Login</title>
    <!-- Firebase SDKs for OTP & Google Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #000000; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { width: 100%; max-width: 450px; height: 100vh; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px; text-align: center; position: relative; }
        
        .logo-box { width: 90px; height: 90px; background: #1DA1F2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(29, 161, 242, 0.4); }
        .app-title { font-size: 28px; font-weight: bold; margin-bottom: 8px; color: #ffffff; }
        .app-subtitle { font-size: 14px; color: #888; margin-bottom: 30px; }
        
        .input-group { width: 100%; margin-bottom: 15px; }
        .login-input { width: 100%; padding: 14px; border-radius: 25px; border: 1px solid #333; background: #1e1e1e; color: white; font-size: 16px; outline: none; text-align: center; }
        .login-input:focus { border-color: #1DA1F2; }
        
        .btn-primary { width: 100%; padding: 14px; border-radius: 25px; border: none; background: #1DA1F2; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-google { width: 100%; padding: 14px; border-radius: 25px; border: 1px solid #444; background: #ffffff; color: #333; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .divider { margin: 20px 0; color: #666; font-size: 13px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="logo-box">🐦</div>
    <h1 class="app-title">TapChat</h1>
    <p class="app-subtitle">कनेक्ट हों, रील्स देखें और AI से बात करें</p>

    <!-- Phone Number Block -->
    <div id="phoneBlock" style="width: 100%;">
        <div class="input-group">
            <input type="tel" id="phoneNumber" class="login-input" placeholder="+91 9876543210">
        </div>
        <div id="recaptcha-container"></div>
        <button class="btn-primary" onclick="sendOTP()">OTP प्राप्त करें</button>
    </div>

    <!-- OTP Input Block (Initially Hidden) -->
    <div id="otpBlock" style="width: 100%; display: none;">
        <div class="input-group">
            <input type="number" id="otpCode" class="login-input" placeholder="6 अंकों का OTP दर्ज करें">
        </div>
        <button class="btn-primary" onclick="verifyOTP()">OTP वेरिफाई करें</button>
    </div>

    <div class="divider">अथवा</div>

    <!-- Google Login -->
    <button class="btn-google" onclick="loginWithGoogle()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
        Google से साइन-इन करें
    </button>
</div>

<script>
    // Firebase Config Integrated
    const firebaseConfig = {
        apiKey: "AIzaSyAtK4US0eTXURt2Uutb9GYif_NclzXfhZM",
        authDomain: "tapchat-official.firebaseapp.com",
        projectId: "tapchat-official",
        storageBucket: "tapchat-official.firebasestorage.app",
        messagingSenderId: "664579432894",
        appId: "1:664579432894:web:dfd69cc0a650bdd13f99ef",
        measurementId: "G-J7RW4S4481"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    let confirmationResultGlobal = null;

    window.onload = function() {
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
            'size': 'invisible'
        });
    };

    function sendOTP() {
        const phone = document.getElementById("phoneNumber").value.trim();
        if (!phone || phone.length < 10) {
            alert("कृपया देश के कोड के साथ सही मोबाइल नंबर दर्ज करें (जैसे +919876543210)");
            return;
        }

        const appVerifier = window.recaptchaVerifier;
        firebase.auth().signInWithPhoneNumber(phone, appVerifier)
            .then((confirmationResult) => {
                confirmationResultGlobal = confirmationResult;
                document.getElementById("phoneBlock").style.display = "none";
                document.getElementById("otpBlock").style.display = "block";
                alert("OTP आपके मोबाइल नंबर पर भेज दिया गया है!");
            }).catch((error) => {
                alert("OTP भेजने में समस्या आई: " + error.message);
            });
    }

    function verifyOTP() {
        const code = document.getElementById("otpCode").value.trim();
        if (!code) return;

        confirmationResultGlobal.confirm(code).then((result) => {
            alert("लॉगिन सफल हुआ!");
            window.location.href = "index.html";
        }).catch((error) => {
            alert("गलत OTP! कृपया दोबारा प्रयास करें।");
        });
    }

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider).then((result) => {
            alert("गूगल लॉगिन सफल हुआ!");
            window.location.href = "index.html";
        }).catch((error) => {
            alert("गूगल साइन-इन एरर: " + error.message);
        });
    }
</script>

</body>
</html>
