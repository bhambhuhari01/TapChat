<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapChat - Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid #2a2a2a; }
        .profile-avatar { width: 80px; height: 80px; background: #1DA1F2; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; }
        .stats-bar { display: flex; justify-content: space-around; padding: 15px 0; border-bottom: 1px solid #2a2a2a; background: #1a1a1a; }
        .stat-item { text-align: center; }
        .stat-num { font-weight: bold; font-size: 16px; }
        .stat-label { font-size: 12px; color: #888; }
        .back-btn { background: none; border: none; color: #1DA1F2; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <button class="back-btn" onclick="window.location.href='app.html'">← Back</button>
        <span id="profTitle">Profile</span>
        <div></div>
    </div>

    <div class="profile-header">
        <div class="profile-avatar">U</div>
        <h3>TapChat User</h3>
        <p style="color: #888; font-size: 13px; margin-top: 4px;">@tapchat_user</p>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-num">0</div>
            <div class="stat-label" id="lblPosts">Posts</div>
        </div>
        <div class="stat-item">
            <div class="stat-num">0</div>
            <div class="stat-label" id="lblFollowers">Followers</div>
        </div>
        <div class="stat-item">
            <div class="stat-num">0</div>
            <div class="stat-label" id="lblFollowing">Following</div>
        </div>
    </div>

    <div style="padding: 20px; text-align: center; color: #666; font-size: 14px;" id="noPosts">
        Your uploaded posts will appear here.
    </div>
</div>

<script>
    let currentLang = localStorage.getItem('tapchat_lang') || 'en';
    if(currentLang === 'hi') {
        document.getElementById('profTitle').innerText = "प्रोफ़ाइल";
        document.getElementById('lblPosts').innerText = "पोस्ट्स";
        document.getElementById('lblFollowers').innerText = "फॉलोअर्स";
        document.getElementById('lblFollowing').innerText = "फॉलोइंग";
        document.getElementById('noPosts').innerText = "आपकी पोस्ट्स यहाँ दिखाई देंगी।";
    }
</script>

</body>
</html>
